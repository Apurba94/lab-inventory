[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-inventory"
version = "0.1.0"
description = "SQLite reagent inventory with locations, lot numbers and expiry/low-stock alerts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
lab-inventory = "lab_inventory.cli:main"

[tool.setuptools]
packages = ["lab_inventory"]
